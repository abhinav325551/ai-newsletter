[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-newsletter"
version = "0.1.0"
description = "Personal AI & Tech newsletter generator"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "feedparser>=6.0.11",
    "trafilatura>=1.12.0",
    "rapidfuzz>=3.9.0",
    "praw>=7.8.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "arxiv>=2.1.3",
    "click>=8.1.7",
    "pyyaml>=6.0.2",
    "loguru>=0.7.2",
    "lxml>=5.2.0",
    "lxml-html-clean>=0.2.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
]

[project.scripts]
ai-newsletter = "main:cli"

[tool.hatch.build.targets.wheel]
packages = ["."]
