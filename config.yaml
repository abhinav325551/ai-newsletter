# ─────────────────────────────────────────────────────────────────────────────
# AI Newsletter — Master Configuration
# Edit source lists here without touching any code.
# ─────────────────────────────────────────────────────────────────────────────

# ── General ───────────────────────────────────────────────────────────────────
newsletter:
  title: "AI & Tech Intelligence"
  subtitle: "The full AI stack — infrastructure to application layer"
  since_days: 1          # default lookback window (overridden by --since flag)
  max_items_per_section: 8
  min_hn_score: 50
  min_reddit_score: 20
  embedding_backend: "local"   # "local" (sentence-transformers) | "anthropic"
  local_embedding_model: "all-MiniLM-L6-v2"
  summarization_model: "claude-sonnet-4-6"
  cluster_similarity_threshold: 0.82
  dedup_title_threshold: 88    # rapidfuzz score 0-100

# ── Source authority weights (used in importance scoring) ─────────────────────
source_weights:
  the_information: 1.0
  bloomberg: 0.95
  wsj: 0.95
  ft: 0.9
  reuters: 0.85
  nytimes: 0.85
  anthropic_blog: 1.0
  openai_blog: 1.0
  deepmind_blog: 1.0
  meta_ai_blog: 0.95
  semianalysis: 1.0
  stratechery: 0.95
  default: 0.6

# ── AI/ML keyword filter (applied to HN + Reddit titles) ──────────────────────
ai_keywords:
  - llm
  - large language model
  - foundation model
  - transformer
  - diffusion
  - generative ai
  - gen ai
  - openai
  - anthropic
  - claude
  - gpt
  - gemini
  - mistral
  - llama
  - deepseek
  - grok
  - cohere
  - hugging face
  - huggingface
  - inference
  - training run
  - gpu cluster
  - nvidia
  - h100
  - b200
  - gb200
  - tpu
  - groq
  - cerebras
  - data center
  - ai chip
  - reasoning model
  - multimodal
  - vector database
  - rag
  - retrieval augmented
  - agent
  - agentic
  - langchain
  - llamaindex
  - langgraph
  - dspy
  - fine-tuning
  - lora
  - rlhf
  - rlaif
  - ai safety
  - alignment
  - benchmark
  - evals
  - saas disruption
  - ai startup
  - copilot
  - cursor
  - devin
  - swe-agent
  - vibe coding
  - ai coding

