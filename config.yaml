# ── Hacker News ───────────────────────────────────────────────────────────────
hacker_news:
  min_score: 50
  max_items: 60
  story_types:
    - "topstories"
    - "beststories"

# ── Reddit ─────────────────────────────────────────────────────────────────────
reddit:
  subreddits:
    - name: "MachineLearning"
      weight: 0.9
    - name: "LocalLLaMA"
      weight: 0.9
    - name: "singularity"
      weight: 0.75
    - name: "artificial"
      weight: 0.7
    - name: "OpenAI"
      weight: 0.8
    - name: "ClaudeAI"
      weight: 0.8
    - name: "ChatGPT"
      weight: 0.75
    - name: "saas"
      weight: 0.65
    - name: "startups"
      weight: 0.65
    - name: "technology"
      weight: 0.6
  time_filters:
    - "day"
    - "week"
  post_limit: 25

