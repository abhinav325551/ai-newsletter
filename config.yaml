# ── arXiv categories ───────────────────────────────────────────────────────────
arxiv:
  categories:
    - "cs.AI"
    - "cs.CL"
    - "cs.LG"
    - "cs.CV"
    - "stat.ML"
  max_papers: 30
  sort_by: "SubmittedDate"

# ── Newsletter sections (order controls render order) ─────────────────────────
sections:
  - id: "big_thing"
    title: "The Big Thing"
    description: "The single most important AI story this week"
  - id: "infrastructure"
    title: "Infrastructure & Silicon"
    description: "Chips, data centers, training, inference optimization"
  - id: "models_research"
    title: "Models & Research"
    description: "Foundation model releases, open-source, benchmarks, papers"
  - id: "tooling_agents"
    title: "Tooling & Agents"
    description: "Frameworks, orchestration, vector DBs, eval, dev tools"
  - id: "applications"
    title: "Applications & Consumer AI"
    description: "Product launches, consumer apps, enterprise AI"
  - id: "saas_disruption"
    title: "SaaS Disruption Watch"
    description: "Incumbent SaaS categories being pressured or rebuilt by AI"
  - id: "signals"
    title: "Signals from the Feed"
    description: "Notable takes from Twitter, Reddit, and HN"
  - id: "worth_reading"
    title: "Worth Reading"
    description: "Long-reads, essays, podcast episodes"
  - id: "papers"
    title: "Papers of the Week"
    description: "Top arXiv papers and Papers With Code trending"
